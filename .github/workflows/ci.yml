name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package manifest
        run: cargo package --locked --allow-dirty
      - name: Machine contracts and completions
        shell: bash
        run: |
          cargo build --locked
          for document in brief run start status list logs wait stop leases gc error; do
            target/debug/procherd --format json schema --document "${document}" \
              | jq -e . >/dev/null
          done
          for shell in bash zsh fish powershell elvish; do
            test -n "$(target/debug/procherd completions "${shell}")"
          done

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # master, Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --all-targets --locked
      - name: Test Windows contracts with per-test deadlines
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 15
        run: |
          cargo test --lib --locked
          cargo test --bin procherd --locked
          mapfile -t tests < <(
            cargo test --test cli --locked -- --list \
              | sed -n 's/: test$//p'
          )
          test "${#tests[@]}" -gt 0
          failures=0
          for test_name in "${tests[@]}"; do
            printf 'running Windows CLI test: %s\n' "${test_name}"
            if ! timeout 45s cargo test --test cli --locked "${test_name}" -- \
                --exact --nocapture --test-threads=1; then
              printf 'Windows CLI test failed: %s\n' "${test_name}"
              failures=$((failures + 1))
            fi
          done
          test "${failures}" -eq 0
      - name: Capture bounded Windows failure diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name = 'procherd.exe'" |
            Select-Object ProcessId, ParentProcessId, CommandLine |
            Format-List
          Get-ChildItem -Path $env:TEMP -Filter state.json -File -Recurse `
              -ErrorAction SilentlyContinue |
            Where-Object FullName -Like '*run_*' |
            Select-Object -First 100 |
            ForEach-Object {
              Write-Output "state document: $($_.FullName)"
              Get-Content -Path $_.FullName
            }
      - name: Build release binary
        run: cargo build --release --locked

  lifecycle-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Repeat detached lifecycle fixtures
        shell: bash
        run: |
          for iteration in $(seq 1 10); do
            cargo test --test cli --locked --quiet
            printf 'lifecycle iteration %s/10 passed\n' "${iteration}"
          done
