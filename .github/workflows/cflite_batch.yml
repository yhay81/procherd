name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: "47 2 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: clusterfuzzlite-batch
  cancel-in-progress: false

jobs:
  BatchFuzzing:
    name: Fuzz main corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read # Fetch prior ClusterFuzzLite corpora.
      contents: read
      security-events: write # Upload ClusterFuzzLite SARIF findings.
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 900
          language: rust
          mode: batch
          sanitizer: address
          output-sarif: true
      - name: Upload SARIF
        if: ${{ always() && hashFiles('cifuzz-sarif/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: cifuzz-sarif/results.sarif
          category: clusterfuzzlite-address
